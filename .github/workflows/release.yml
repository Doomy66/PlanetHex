# Builds the Windows installer and attaches it to a GitHub release.
#
# Tag driven rather than push driven: an installer needs a version to be the
# version of, and `npm run package` names the exe after the version field in
# package.json. Pushing a v1.0.1 tag is what makes a release; a push to main
# publishes the web build and nothing else. See deploy.yml.
#
# windows-latest because the target is NSIS. electron-builder can cross build a
# Windows installer from Linux through wine, but the NSIS installer is the thing
# a user runs as an executable on their own machine, and building it anywhere
# but Windows is a needless way to find out it does not.

name: Release the desktop build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tag and package.json have to agree. They are bumped by hand and in
      # separate commits, so they can drift, and the exe takes its name from
      # package.json rather than from the tag: a v1.0.2 tag on a 1.0.1 checkout
      # would publish a release full of 1.0.1 files without complaining.
      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "Tag $tag does not match package.json version $version"
          }
          Write-Host "Releasing $version"

      - run: npm test

      # PLANETHEX_OUT puts the output beside the checkout. The default in
      # electron/package.cjs exists to dodge a ReFS rename failure on the
      # author's D: drive; the runner is NTFS, so a plain release/ is fine and
      # keeps the artefact where the next step can find it.
      - name: Build the installer
        run: npm run package
        env:
          PLANETHEX_OUT: release

      # gh is on the runner already, so publishing needs no third party action.
      # Only the exe is attached: electron-builder also writes a .blockmap and a
      # latest.yml for its own auto updater, which this application does not use.
      #
      # The file is named rather than matched. A glob for PlanetHex-Setup-*.exe
      # would also catch the PlanetHex-Setup-<version>.__uninstaller.exe that
      # NSIS writes and then deletes, were a build ever to fail between the two.
      #
      # Create where there is nothing yet, upload where there is already. A tag
      # push is not the only way a release gets made - somebody releasing by
      # hand makes one too, and then this step arrived at a tag it could not
      # create and failed the build over work that had in fact been done. The
      # v2.0.0 and v2.2.0 runs both died exactly there, after passing the tests
      # and building the installer. Publishing the same installer twice should
      # be quiet, not red.
      #
      # An existing release keeps its title and its notes. Whoever made it by
      # hand may have written something, and the asset is the only part of it
      # this workflow is entitled to be sure about.
      #
      # The question is asked with a listing rather than with `gh release view`,
      # which exits non-zero when the tag is not there. The runner's pwsh turns
      # a non-zero native command into a thrown error under the `stop` it runs
      # these scripts with, so asking that way would make the probe for "is it
      # there yet" fail in exactly the case it exists to detect. A listing comes
      # back empty and succeeds.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $exe = "release/PlanetHex-Setup-$version.exe"
          if (-not (Test-Path $exe)) { throw "No installer at $exe" }
          $released = gh release list --limit 200 --json tagName --jq '.[].tagName'
          if ($released -contains $tag) {
            Write-Host "$tag is already released; replacing its installer."
            gh release upload $tag $exe --clobber
          } else {
            Write-Host "Releasing $tag."
            gh release create $tag $exe `
              --title "PlanetHex $tag" `
              --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing $tag failed." }
