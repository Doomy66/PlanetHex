# An installer rather than a portable exe. The portable target is a
# self-extracting archive: it unpacked 380MB into a temp folder on every launch,
# which cost ten seconds a run before the application even started. An installer
# unpacks once and every launch after that goes straight to the program.
appId: com.planethex.app
productName: PlanetHex
# three and the rest are bundled into dist/ by Vite, so node_modules has no
# place in the package.
files:
  - dist/**
  - electron/**
  - package.json
win:
  target: nsis
  # Generated from build/icon.svg by `npm run icon`.
  icon: build/icon.ico
nsis:
  artifactName: PlanetHex-Setup-${version}.exe
  # Per user rather than per machine, so installing needs no administrator and
  # nothing outside the user's own profile is touched.
  perMachine: false
  # An assisted installer: it says where it is going and lets that be changed.
  # The one click kind installs the moment it is opened, which is the wrong
  # default for something a user has just downloaded and not yet decided about.
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PlanetHex
  # Drawn by `npm run sidebar`, which packaging runs. NSIS wants 164x314.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
# The MIT licence of the Tabler icon used for the application icon has to travel
# with the binary that embeds it.
extraResources:
  - from: build/LICENSE-tabler-icons.txt
    to: LICENSE-tabler-icons.txt
  # The application's own licence, for a reader who goes looking for a file
  # called one. The help of Spec 4.8 carries the same text inside the program,
  # since a licence a user cannot find is one they have not been given.
  - from: LICENSE
    to: LICENSE.txt
